<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotifia</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .artist-art img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 50%;
      }
      .artist-card:nth-child(1) .artist-art img { object-position: center 36%; }
      .artist-card:nth-child(2) .artist-art img { object-position: center 34%; }
      .artist-card:nth-child(3) .artist-art img { object-position: center 38%; }
      .artist-card:nth-child(4) .artist-art img { object-position: center 35%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
