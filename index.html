<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotifia</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .artist-art {
        position: relative;
        overflow: hidden;
      }

      .artist-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--artist-image-position, center);
        transform: scale(var(--artist-image-scale, 1));
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
